name: structured-model-reuse

on:
  push:
    branches: [equational-residual-v1]
    paths:
      - experiments/structured_model_reuse/*.lean
      - experiments/structured_model_reuse/leanproj/**
      - .github/workflows/structured-model-reuse.yml
  workflow_dispatch:

concurrency:
  group: structured-model-reuse-v1
  cancel-in-progress: true

jobs:
  test:
    name: test-${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target:
          - 22505_to_40367
          - 2531_to_30128
          - 2531_to_43283
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare exact Mathlib environment
        working-directory: experiments/structured_model_reuse/leanproj
        run: |
          lake update
          lake exe cache get
      - name: Test exact structured-model reuse
        working-directory: experiments/structured_model_reuse/leanproj
        run: lake env lean -j 1 -M 4096 ../${{ matrix.target }}.lean

name: P vs NP developmental closure v1

on:
  push:
    branches: [pvsnp-developmental-closure-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest -q
      - run: python pvsnp_developmental_closure_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: pvsnp-developmental-closure-v1-evidence
          path: pvsnp-developmental-closure-v1-summary.json
          if-no-files-found: error

name: Collatz QCKN controller
on:
  push:
    branches: [collatz-qckn-v1-adapter]
    paths:
      - 'realitygraph/collatz_controller.py'
      - 'tests/test_collatz_controller.py'
      - '.github/workflows/collatz-qckn-controller.yml'
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Qualify closed-loop controller
        run: |
          set -euo pipefail
          python -m unittest tests.test_collatz_controller -v

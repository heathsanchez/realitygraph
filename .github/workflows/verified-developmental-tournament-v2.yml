name: verified-developmental-tournament-v2

on:
  push:
    branches:
      - verified-developmental-tournament-v2
  workflow_dispatch:

concurrency:
  group: verified-developmental-tournament-v2
  cancel-in-progress: true

jobs:
  developmental-compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REALITYGRAPH_DEVELOPMENTAL_V2_SEED: ${{ github.sha }}-developmental-v2
      REALITYGRAPH_DEVELOPMENTAL_V2_RESULT: verified-developmental-tournament-v2-summary.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify retained and frontier machinery
        run: |
          python -m unittest             tests.test_transfer_memory             tests.test_retained_capability             tests.test_developmental_tournament -v

      - name: Acquire pinned legacy grouped worlds
        run: python prepare_grouped_datasets.py

      - name: Run source-distinct developmental compiler
        run: python verified_developmental_tournament_v2.py

      - name: Preserve V2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-developmental-tournament-v2-evidence
          path: verified-developmental-tournament-v2-summary.json
          if-no-files-found: warn
          retention-days: 14

name: capability-generator-controller-v3-manifest
on:
  push:
    branches:
      - capability-generator-controller-transfer-v3
  workflow_dispatch:
concurrency:
  group: capability-generator-controller-v3-manifest
  cancel-in-progress: true
jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet openml
      - run: python probe_capability_generator_controller_v3_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: capability-generator-controller-v3-manifest
          path: capability-generator-controller-transfer-v3-manifest.json
          retention-days: 14

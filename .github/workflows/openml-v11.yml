name: openml-v11-capability-state
on:
  push:
    branches:
      - openml-v11
  workflow_dispatch:
concurrency:
  group: openml-v11-capability-state
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REALITYGRAPH_OPENML_V11_RESULT: openml-v11-summary.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet openml pandas
      - name: Run evidence-conditioned capability state V11
        run: python openml_v11.py
      - name: Preserve V11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openml-v11-evidence
          path: openml-v11-summary.json
          if-no-files-found: warn
          retention-days: 14

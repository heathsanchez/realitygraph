name: equational-derived-specialization

on:
  push:
    branches: [equational-residual-v1]
    paths:
      - equational_derived_specialization.py
      - equational_residual_demo.py
      - equational_transition_demo.py
      - .github/workflows/equational-derived-specialization.yml
  workflow_dispatch:

concurrency:
  group: equational-derived-specialization-v1
  cancel-in-progress: true

jobs:
  specialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Specialize previously proved derived laws
        run: python equational_derived_specialization.py
      - uses: actions/upload-artifact@v4
        with:
          name: equational-derived-specialization-v1
          path: results/equational-derived-specialization-v1.json
          if-no-files-found: error
          retention-days: 3

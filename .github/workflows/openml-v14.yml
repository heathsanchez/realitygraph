name: openml-v14-portfolio-verifier
on:
  push:
    branches:
      - openml-v14
  workflow_dispatch:
concurrency:
  group: openml-v14-portfolio-verifier
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REALITYGRAPH_OPENML_V14_RESULT: openml-v14-summary.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet openml pandas
      - name: Run portfolio verifier compilation V14
        run: python openml_v14.py
      - name: Preserve V14 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openml-v14-evidence
          path: openml-v14-summary.json
          if-no-files-found: warn
          retention-days: 14

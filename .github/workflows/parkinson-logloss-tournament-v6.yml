name: parkinson-logloss-tournament-v6
on:
  push:
    branches:
      - parkinson-logloss-tournament-v6
  workflow_dispatch:
concurrency:
  group: parkinson-logloss-tournament-v6-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy scipy
      - run: python -m unittest tests.test_logloss_meta tests.test_logloss_runtime_patch -v
      - run: |
          python -m py_compile parkinson_logloss_tournament_v6.py
          if [ -f parkinson_build_logloss_v6.py ]; then
            python -m py_compile parkinson_build_logloss_v6.py
          fi

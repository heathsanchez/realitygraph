name: equational-other-countermodel-decomposition

on:
  push:
    branches: [equational-residual-v1]
    paths:
      - equational_other_countermodel_decomposition.py
      - equational_residual_demo.py
      - equational_transition_demo.py
      - equational_internal_lemma_bank.py
      - .github/workflows/equational-other-countermodel-decomposition.yml
  workflow_dispatch:

concurrency:
  group: equational-other-countermodel-decomposition-v1
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decompose transferable countermodel family
        run: python equational_other_countermodel_decomposition.py
      - uses: actions/upload-artifact@v4
        with:
          name: equational-other-countermodel-decomposition-v1
          path: results/equational-other-countermodel-decomposition-v1.json
          if-no-files-found: error
          retention-days: 3

name: openml-v7-cross-corpus

on:
  push:
    branches:
      - openml-v7
  workflow_dispatch:

concurrency:
  group: openml-v7-cross-corpus
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REALITYGRAPH_OPENML_V7_RESULT: openml-v7-summary.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet openml
      - name: Run cross-corpus developmental scope
        run: python openml_v7.py
      - name: Preserve V7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openml-v7-evidence
          path: openml-v7-summary.json
          if-no-files-found: warn
          retention-days: 14

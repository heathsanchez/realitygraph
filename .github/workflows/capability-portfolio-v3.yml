name: capability-portfolio-v3
on:
  workflow_dispatch:
  push:
    branches:
      - portfolio-v3
jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REALITYGRAPH_PORTFOLIO_RESULT: capability-portfolio-v3-summary.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_transfer_memory tests.test_retained_capability tests.test_developmental_tournament -v
      - run: python prepare_grouped_datasets.py
      - run: python capability_portfolio_v3.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-portfolio-v3-evidence
          path: capability-portfolio-v3-summary.json
          if-no-files-found: warn
          retention-days: 14

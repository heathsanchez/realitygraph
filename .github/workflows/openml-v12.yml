name: openml-v12-adaptive-evidence
on:
  push:
    branches:
      - openml-v12
  workflow_dispatch:
concurrency:
  group: openml-v12-adaptive-evidence
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REALITYGRAPH_OPENML_V12_RESULT: openml-v12-summary.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet openml pandas
      - name: Run adaptive evidence V12
        run: python openml_v12.py
      - name: Preserve V12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openml-v12-evidence
          path: openml-v12-summary.json
          if-no-files-found: warn
          retention-days: 14

name: equational-rewrite-closure

on:
  push:
    branches: [equational-residual-v1]
    paths:
      - equational_rewrite_closure.py
      - equational_residual_demo.py
      - equational_transition_demo.py
      - .github/workflows/equational-rewrite-closure.yml
  workflow_dispatch:

concurrency:
  group: equational-rewrite-closure-v1
  cancel-in-progress: true

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile repeated contextual consequences
        run: python equational_rewrite_closure.py
      - uses: actions/upload-artifact@v4
        with:
          name: equational-rewrite-closure-v1
          path: results/equational-rewrite-closure-v1.json
          if-no-files-found: error
          retention-days: 3

name: openml-v9-probation
on:
  push:
    branches:
      - openml-v9
  workflow_dispatch:
concurrency:
  group: openml-v9-probation
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REALITYGRAPH_OPENML_V9_RESULT: openml-v9-summary.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet openml pandas
      - name: Run verifier-gated probation V9
        run: python openml_v9.py
      - name: Preserve V9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openml-v9-evidence
          path: openml-v9-summary.json
          if-no-files-found: warn
          retention-days: 14

name: QCKN Flash counterfactual market v1

on:
  push:
    branches: [qckn-flash-counterfactual-market-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run nonlinear counterfactual market test
        run: python -m unittest tests.test_flash_counterfactual_market -v

name: QCKN Live Real Episode V14

on:
  push:
    branches: [qckn-live-developmental-substrate-v3]
    paths:
      - "frozen-meta/qckn-live-real-episode-v14.json"
      - "qckn_live_real_episode_v14.py"
      - ".github/workflows/qckn-live-real-episode-v14.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Retrieve episode-thirteen evidence
        run: |
          set -euo pipefail
          artifact_id=10582093003
          expected_digest='sha256:841e41d66e4628e33060503398b27039bc3d2d6845aa93a471a8830454632419'
          actual_digest="$(gh api "repos/heathsanchez/realitygraph/actions/artifacts/$artifact_id" --jq '.digest')"
          test "$actual_digest" = "$expected_digest"
          mkdir -p /tmp/qckn-live-real-episode-v14/episode13
          gh api "repos/heathsanchez/realitygraph/actions/artifacts/$artifact_id/zip" > /tmp/episode13.zip
          unzip -q /tmp/episode13.zip -d /tmp/qckn-live-real-episode-v14/episode13
          evidence="$(find /tmp/qckn-live-real-episode-v14/episode13 -type f -name episode13.json -print -quit)"
          test -n "$evidence"
          cp "$evidence" /tmp/qckn-live-real-episode-v14/episode13.json

      - name: Retrieve substitute node-reuse accounting evidence
        run: |
          set -euo pipefail
          artifact_id=10582183120
          expected_digest='sha256:238012eaeae5ca66ee72ecd7ff9bac32eb995ff048c3ceb95d1836fbbea4a94b'
          actual_digest="$(gh api "repos/heathsanchez/lean-kernel-arena/actions/artifacts/$artifact_id" --jq '.digest')"
          test "$actual_digest" = "$expected_digest"
          mkdir -p /tmp/qckn-live-real-episode-v14/target
          gh api "repos/heathsanchez/lean-kernel-arena/actions/artifacts/$artifact_id/zip" > /tmp/target14.zip
          unzip -q /tmp/target14.zip -d /tmp/qckn-live-real-episode-v14/target
          evidence="$(find /tmp/qckn-live-real-episode-v14/target -type f -name substitute-node-reuse-accounting-v1.json -print -quit)"
          test -n "$evidence"
          cp "$evidence" /tmp/qckn-live-real-episode-v14/target.json

      - name: Reclose fourteenth cycle
        run: |
          mkdir -p /tmp/qckn-live-real-episode-v14/result
          python -u qckn_live_real_episode_v14.py             --precommit frozen-meta/qckn-live-real-episode-v14.json             --target /tmp/qckn-live-real-episode-v14/target.json             --episode13 /tmp/qckn-live-real-episode-v14/episode13.json             --out /tmp/qckn-live-real-episode-v14/result             | tee /tmp/qckn-live-real-episode-v14/run.log

      - name: Gate fourteenth real cycle
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/qckn-live-real-episode-v14/result/episode14.json'))
          assert r['verdict']=='PASS'
          assert all(r['gates'].values()),r['gates']
          assert r['target']['classification']=='allocation-dominant'
          assert r['closure']['cumulative_exact_routes_eliminated']==15
          assert 'lean:substitution-output-allocation-dominant:v1' in r['closure']['separators']
          assert 'lean:substitution-fresh-app-allocation-hotspot:v1' in r['closure']['separators']
          print('PASS_QCKN_LIVE_REAL_EPISODE_V14')
          print('CUMULATIVE_EXACT_ROUTES_ELIMINATED=15')
          print('NEXT_BATTLE='+r['reselection']['next_battle_experiment'])
          print('NEXT_DISCOVERY='+r['reselection']['next_discovery_experiment'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qckn-live-real-episode-v14
          path: /tmp/qckn-live-real-episode-v14/
          if-no-files-found: error

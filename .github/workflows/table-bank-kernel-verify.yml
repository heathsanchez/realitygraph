name: table-bank-kernel-verify

on:
  push:
    branches: [equational-residual-v1]
    paths:
      - experiments/table_bank_verify/*.lean
      - experiments/structured_model_reuse/leanproj/**
      - .github/workflows/table-bank-kernel-verify.yml
  workflow_dispatch:

concurrency:
  group: table-bank-kernel-verify-v1
  cancel-in-progress: true

jobs:
  verify:
    name: verify-${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        target:
          - 12820_to_2841
          - 12820_to_40755
          - 33419_to_323
          - 33419_to_3392
          - 33419_to_3412
          - 33419_to_3587
          - 33419_to_3746
          - 33419_to_4064
          - 33419_to_41819
          - 33419_to_4291
          - 33419_to_4802
          - 33419_to_55538
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned Mathlib
        working-directory: experiments/structured_model_reuse/leanproj
        run: |
          lake update
          lake exe cache get
      - name: Kernel-check compiled table-bank certificate
        working-directory: experiments/structured_model_reuse/leanproj
        run: lake env lean -j 1 -M 4096 ../../table_bank_verify/${{ matrix.target }}.lean

name: parkinson-threshold-trajectory-v3
on:
  push:
    branches:
      - parkinson-threshold-trajectory-v3
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy
      - run: python -m unittest tests.test_threshold_trajectory -v
      - run: |
          if [ -f parkinson_threshold_trajectory_v3.py ]; then
            python -m py_compile parkinson_threshold_trajectory_v3.py
          fi

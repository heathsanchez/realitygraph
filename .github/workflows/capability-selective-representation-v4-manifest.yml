name: capability-selective-representation-v4-manifest
on:
  push:
    branches:
      - capability-selective-representation-v4
  workflow_dispatch:
concurrency:
  group: capability-selective-representation-v4-manifest
  cancel-in-progress: true
jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet openml
      - run: python probe_capability_selective_representation_v4_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: capability-selective-representation-v4-manifest
          path: capability-selective-representation-v4-manifest.json
          retention-days: 14

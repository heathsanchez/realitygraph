name: QCKN Live Win Portfolio V3
on:
  push:
    branches: [qckn-live-win-portfolio-v3]
    paths:
      - 'qckn_live_win_portfolio_v2.py'
      - 'qckn_live_win_portfolio_v3.py'
      - '.github/workflows/qckn-live-win-portfolio-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile repriced portfolio
        run: python -m py_compile qckn_live_win_portfolio_v2.py qckn_live_win_portfolio_v3.py
      - name: Run post-closure sensitivity ranking
        env:
          QCKN_LIVE_WIN_PORTFOLIO_V3_RESULT_PATH: qckn-live-win-portfolio-v3-result.json
        run: python -u qckn_live_win_portfolio_v3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qckn-live-win-portfolio-v3
          path: qckn-live-win-portfolio-v3-result.json
          if-no-files-found: error

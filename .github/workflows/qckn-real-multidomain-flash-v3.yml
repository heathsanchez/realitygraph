name: QCKN Real Multidomain Flash V3

on:
  push:
    branches:
      - qckn-real-multidomain-flash-v3
    paths:
      - "realitygraph/real_flash.py"
      - "realitygraph/flash_bus.py"
      - "qckn_real_multidomain_flash_v1.py"
      - "qckn_real_multidomain_flash_v2.py"
      - "qckn_real_multidomain_flash_v3.py"
      - "tests/test_real_flash.py"
      - "tests/test_flash_bus.py"
      - "docs/research/qckn-real-multidomain-flash-v3.md"
      - ".github/workflows/qckn-real-multidomain-flash-v3.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-multidomain-flash-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Protect graph and event-bus contracts
        run: |
          python -m unittest tests.test_real_flash -v
          python -m unittest tests.test_flash_bus -v

      - name: Attach measured GPU hardware authority
        run: |
          mkdir -p /tmp/qckn-real-multidomain-flash-v3
          python qckn_real_multidomain_flash_v3.py \
            --out /tmp/qckn-real-multidomain-flash-v3 \
            | tee /tmp/qckn-real-multidomain-flash-v3/run.log

      - name: Gate five-domain authority closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("/tmp/qckn-real-multidomain-flash-v3")
          r=json.loads((root/"real-multidomain-flash-v3.json").read_text())
          assert r["verdict"]=="PASS"
          assert all(r["gates"].values())
          assert set(r["meta_capability"]["supporting_domains"])=={
              "sair","arc","lean-kernel","gpu-ir"
          }
          assert all(
              row["status"]=="SETTLED"
              for row in r["residuals"].values()
          )
          assert r["event_bus"]["edge_count"]==5
          assert r["event_bus"]["meta_edge_count"]==4
          assert r["event_bus"]["hardware_edge_count"]==1
          assert r["event_bus"]["unrelated_literal_content_edges"]==0
          assert r["event_bus"]["scalarization_rejected"] is True
          assert r["hardware_authority"]["gpu"]=="NVIDIA GeForce RTX 4090"
          assert r["hardware_authority"]["metrics"]["fuse_adjacent_affine_speedup"] > 1.05
          assert r["hardware_authority"]["metrics"]["remove_identity_speedup"] > 1.05
          print("PASS_QCKN_REAL_MULTIDOMAIN_FLASH_V3")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qckn-real-multidomain-flash-v3
          path: /tmp/qckn-real-multidomain-flash-v3/
          if-no-files-found: error

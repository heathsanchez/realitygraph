name: QCKN Flash temporal runtime v1

on:
  push:
    branches: [qckn-flash-temporal-runtime-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Flash temporal runtime tests
        run: python -m unittest tests.test_flash_temporal_runtime -v

name: equational-multi-law-rewrite

on:
  push:
    branches: [equational-residual-v1]
    paths:
      - equational_multi_law_rewrite.py
      - equational_residual_demo.py
      - equational_transition_demo.py
      - .github/workflows/equational-multi-law-rewrite.yml
  workflow_dispatch:

concurrency:
  group: equational-multi-law-rewrite-v1
  cancel-in-progress: true

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compose all verified laws available from each premise
        run: python equational_multi_law_rewrite.py
      - uses: actions/upload-artifact@v4
        with:
          name: equational-multi-law-rewrite-v1
          path: results/equational-multi-law-rewrite-v1.json
          if-no-files-found: error
          retention-days: 3

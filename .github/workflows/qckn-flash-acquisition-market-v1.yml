name: QCKN Flash acquisition market v1

on:
  push:
    branches: [qckn-flash-acquisition-market-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run acquisition market tests
        run: python -m unittest tests.test_flash_acquisition_market -v

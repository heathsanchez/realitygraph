name: capability-generator-controller-pilot
on:
  push:
    branches:
      - capability-generator-controller-pilot
  workflow_dispatch:
concurrency:
  group: capability-generator-controller-pilot
  cancel-in-progress: true
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet openml pandas
      - run: python analyze_generator_invocation_v2.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-generator-controller-pilot
          path: capability-generator-controller-pilot.json
          if-no-files-found: warn
          retention-days: 14

name: verified-language-growth-closure-v1

on:
  push:
    branches:
      - verified-language-growth-closure-v1
  workflow_dispatch:

concurrency:
  group: verified-language-growth-closure-v1
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing unit baseline
        run: python -m unittest discover -s tests -v

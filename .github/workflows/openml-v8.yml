name: openml-v8-relational-scope
on:
  push:
    branches:
      - openml-v8
  workflow_dispatch:
concurrency:
  group: openml-v8-relational-scope
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REALITYGRAPH_OPENML_V8_RESULT: openml-v8-summary.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet openml pandas
      - name: Run relational scope V8
        run: python openml_v8.py
      - name: Preserve V8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openml-v8-evidence
          path: openml-v8-summary.json
          if-no-files-found: warn
          retention-days: 14

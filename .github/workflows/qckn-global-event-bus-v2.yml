name: QCKN global event bus v2

on:
  push:
    branches: [qckn-global-event-bus-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Flash bus v2 tests
        run: python -m unittest tests.test_flash_bus -v

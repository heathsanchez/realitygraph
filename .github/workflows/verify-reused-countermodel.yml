name: verify-reused-countermodel

on:
  push:
    branches: [equational-residual-v1]
    paths:
      - certificates/17195_to_43536.lean
      - .github/workflows/verify-reused-countermodel.yml
  workflow_dispatch:

concurrency:
  group: verify-reused-countermodel-v1
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Lean 4.33.1
        run: elan toolchain install leanprover/lean4:v4.33.1
      - name: Kernel-check reused countermodel certificate
        run: lean +leanprover/lean4:v4.33.1 -j 1 -M 1024 certificates/17195_to_43536.lean

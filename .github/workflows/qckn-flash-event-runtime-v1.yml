name: QCKN Flash event runtime v1

on:
  push:
    branches: [qckn-flash-event-runtime-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Flash event runtime tests
        run: python -m unittest tests.test_flash_event_runtime -v

name: QCKN Flash obstruction revocation v1

on:
  push:
    branches: [qckn-flash-obstruction-revocation-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run obstruction revocation tests
        run: python -m unittest tests.test_flash_obstruction_revocation -v

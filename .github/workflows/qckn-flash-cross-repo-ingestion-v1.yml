name: QCKN Flash cross-repo ingestion v1

on:
  push:
    branches: [qckn-flash-cross-repo-ingestion-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run cross-repo ingestion unit tests
        run: python -m unittest tests.test_flash_cross_repo_ingestion -v

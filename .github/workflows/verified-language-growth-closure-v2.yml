name: verified-language-growth-closure-v2

on:
  push:
    branches:
      - verified-language-growth-closure-v2
  workflow_dispatch:

concurrency:
  group: verified-language-growth-closure-v2
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Developmental state tests
        run: python -m unittest tests.test_developmental_state -v
      - name: Generation specification tests
        run: python -m unittest tests.test_generation_spec -v
      - name: Developmental snapshot tests
        run: python -m unittest tests.test_developmental_snapshot -v
      - name: Generic developmental executor tests
        run: python -m unittest tests.test_developmental_executor -v
      - name: Exhaustive G3 state-growth tests
        run: python -m unittest tests.test_three_state_observer_growth -v
      - name: V2 recursive qualification tests
        run: python -m unittest tests.test_verified_language_growth_closure_v2 -v
      - name: Inherited V1 qualification tests
        run: python -m unittest tests.test_verified_language_growth_closure -v
      - name: Full regression suite
        run: python -m unittest discover -s tests -v

      - name: Run sealed bounded V2 qualification
        run: |
          python verified_language_growth_closure_v2.py | tee verified-language-growth-closure-v2.log
          grep -Fx 'PASS_VERIFIED_LANGUAGE_GROWTH_CLOSURE_V2' verified-language-growth-closure-v2.log
          python - <<'PY'
          import json
          p = 'verified-language-growth-closure-v2-summary.json'
          d = json.load(open(p))
          assert d['passed'] is True
          assert d['verdict'] == 'PASS_VERIFIED_LANGUAGE_GROWTH_CLOSURE_V2'
          assert d['closure']['status'] == 'CLOSED_BOUNDED'
          assert d['closure']['qualification_depth'] == 3
          assert d['gates']['same_executor_g1_g2_g3'] is True
          assert d['gates']['executor_has_no_fixture_imports'] is True
          assert d['gates']['executor_has_no_generation_dispatch'] is True
          assert d['gates']['g3_two_state_language_complete'] is True
          assert d['gates']['g3_two_state_no_resolution'] is True
          assert d['gates']['g3_three_state_novel'] is True
          assert d['gates']['g3_depends_on_g2'] is True
          assert d['gates']['g1_ablation_invalidates_g2_g3'] is True
          assert d['gates']['g2_ablation_invalidates_g3_preserves_g1'] is True
          assert d['gates']['g3_ablation_preserves_g1_g2'] is True
          assert d['claims']['open_ended_closure'] is False
          assert d['claims']['unbounded_self_development'] is False
          print('SEALED_V2_SUMMARY_OK', d['closure']['certificate_digest'])
          PY

      - name: Upload V2 qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: verified-language-growth-closure-v2-evidence
          path: |
            verified-language-growth-closure-v2-summary.json
            verified-language-growth-closure-v2.log
          if-no-files-found: error
          retention-days: 30

name: ACC exact tail v1

on:
  push:
    branches: [acc-exact-tail-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run exact-tail tests
        run: |
          python -m pip install -q pytest
          python -m pytest tests/test_acc_exact_tail.py -q

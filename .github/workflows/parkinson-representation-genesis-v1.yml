name: parkinson-representation-genesis-v1
on:
  push:
    branches:
      - parkinson-representation-genesis-v1
  workflow_dispatch:
concurrency:
  group: parkinson-representation-genesis-v1
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy
      - name: Representation genesis contract
        run: python -m unittest tests.test_representation_genesis -v
      - name: Compile local Parkinson experiment
        run: python -m py_compile parkinson_representation_genesis_v1.py

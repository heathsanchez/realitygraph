name: parkinson-representation-genesis-v1
on:
  push:
    branches:
      - parkinson-representation-genesis-v1
      - parkinson-ridge-decoder-v2
      - parkinson-canonical-striatal-v1
      - parkinson-pixel-consequence-atlas-v1
      - parkinson-invariant-3d-v1
      - parkinson-spatial-capacity-audit-v1
      - parkinson-capacity-control-sweep-v1
      - parkinson-msi-representation-tournament-v1
      - parkinson-msi-minimal-recurrence-v2
      - parkinson-object-relative-geometry-v1
  workflow_dispatch:
concurrency:
  group: parkinson-representation-genesis-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy
      - name: Representation genesis contract
        run: python -m unittest tests.test_representation_genesis tests.test_canonical_striatal tests.test_canonical_striatal_experiment tests.test_pixel_consequence_atlas tests.test_invariant_3d tests.test_spatial_capacity_audit tests.test_capacity_control_sweep tests.test_msi_representation_tournament tests.test_msi_minimal_recurrence tests.test_object_relative_geometry -v
      - name: Compile local Parkinson experiments
        run: |
          python -m py_compile parkinson_representation_genesis_v1.py
          python -m py_compile parkinson_ridge_decoder_v2.py
          python -m py_compile parkinson_canonical_striatal_v1.py
          python -m py_compile parkinson_pixel_consequence_atlas_v1.py
          python -m py_compile parkinson_invariant_3d_v1.py
          if [ -f parkinson_spatial_capacity_audit_v1.py ]; then python -m py_compile parkinson_spatial_capacity_audit_v1.py; fi
          if [ -f parkinson_capacity_control_sweep_v1.py ]; then python -m py_compile parkinson_capacity_control_sweep_v1.py; fi
          if [ -f parkinson_msi_representation_tournament_v1.py ]; then python -m py_compile parkinson_msi_representation_tournament_v1.py; fi
          if [ -f parkinson_msi_minimal_recurrence_v2.py ]; then python -m py_compile parkinson_msi_minimal_recurrence_v2.py; fi
          if [ -f parkinson_object_relative_geometry_v1.py ]; then python -m py_compile parkinson_object_relative_geometry_v1.py; fi

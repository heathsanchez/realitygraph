name: QCKN Flash external revocation v1

on:
  push:
    branches: [qckn-flash-external-revocation-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run external revocation tests
        run: python -m unittest tests.test_flash_external_revocation -v

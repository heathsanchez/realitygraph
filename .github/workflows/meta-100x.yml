name: meta-100x-cross-task

on:
  push:
    branches: [meta-100x-v1]
  workflow_dispatch:

concurrency:
  group: meta-100x-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sealed-cross-task:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Meta-policy unit tests
        run: python -m unittest tests.test_meta_policy -v

      - name: Rebuild one hundred classification training worlds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gathered-meta-train
          seq 0 99 | xargs -P 8 -I{} bash -c '
            export REALITYGRAPH_PMLB_INDEX="{}"
            export REALITYGRAPH_PMLB_RESULT="gathered-meta-train/pmlb-world-{}.json"
            python pmlb_meta_world.py
          '

      - name: Freeze exact previously verified policy
        env:
          REALITYGRAPH_META_TRAIN_DIR: gathered-meta-train
          REALITYGRAPH_META_POLICY_DIR: meta-policy-out
        run: |
          set -euo pipefail
          test ! -e gathered-meta-regression
          python learn_pmlb_meta_policy.py
          actual="$(shasum -a 256 meta-policy-out/meta_policy.mg | awk '{print $1}')"
          expected="f80932ec2ce05e85899787a9bd13da15ea7007a496526cb69c776c3bc56baf47"
          echo "policy_sha256=$actual"
          test "$actual" = "$expected"
          echo "FROZEN_POLICY_MATCHES_PRIOR_VERIFIED_BYTES"
          echo "REGRESSION_HELDOUT_NOT_YET_CONSTRUCTED"

      - name: Build twenty untouched regression-family worlds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gathered-meta-regression
          seq 0 19 | xargs -P 4 -I{} bash -c '
            export REALITYGRAPH_PMLB_REGRESSION_INDEX="{}"
            export REALITYGRAPH_PMLB_REGRESSION_RESULT="gathered-meta-regression/pmlb-regression-world-{}.json"
            python pmlb_regression_world.py
          '

      - name: Restart frozen mg in unseen task family
        env:
          REALITYGRAPH_REGRESSION_HELDOUT_DIR: gathered-meta-regression
          REALITYGRAPH_META_POLICY_DIR: meta-policy-out
        run: python evaluate_pmlb_cross_task.py

      - name: Preserve cross-task evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-100x-cross-task-evidence
          path: |
            meta-policy-out
            meta-cross-task-summary.json
            gathered-meta-regression
          if-no-files-found: warn
          retention-days: 7

name: meta-100x

on:
  push:
    branches: [meta-100x-v1]
  workflow_dispatch:

concurrency:
  group: meta-100x-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sealed-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Meta-policy unit tests
        run: python -m unittest tests.test_meta_policy -v

      - name: Build one hundred past dataset worlds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gathered-meta-train
          seq 0 99 | xargs -P 8 -I{} bash -c '
            export REALITYGRAPH_PMLB_INDEX="{}"
            export REALITYGRAPH_PMLB_RESULT="gathered-meta-train/pmlb-world-{}.json"
            python pmlb_meta_world.py
          '

      - name: Compile policy before any second-block world exists
        env:
          REALITYGRAPH_META_TRAIN_DIR: gathered-meta-train
          REALITYGRAPH_META_POLICY_DIR: meta-policy-out
        run: |
          set -euo pipefail
          test ! -e gathered-meta-heldout
          python learn_pmlb_meta_policy.py
          sha256sum meta-policy-out/meta_policy.mg
          echo "SECOND_BLOCK_NOT_YET_CONSTRUCTED"

      - name: Build second untouched twenty dataset worlds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gathered-meta-heldout
          seq 120 139 | xargs -P 4 -I{} bash -c '
            export REALITYGRAPH_PMLB_INDEX="{}"
            export REALITYGRAPH_PMLB_RESULT="gathered-meta-heldout/pmlb-world-{}.json"
            python pmlb_meta_world.py
          '

      - name: Restart frozen mg and verify second untouched block
        env:
          REALITYGRAPH_META_TRAIN_DIR: gathered-meta-train
          REALITYGRAPH_META_HELDOUT_DIR: gathered-meta-heldout
          REALITYGRAPH_META_POLICY_DIR: meta-policy-out
          REALITYGRAPH_META_HELDOUT_START: '120'
        run: python evaluate_pmlb_meta_policy.py

      - name: Preserve sealed confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-100x-second-block-evidence
          path: |
            meta-policy-out
            meta-heldout-summary.json
            gathered-meta-train
            gathered-meta-heldout
          if-no-files-found: warn
          retention-days: 7

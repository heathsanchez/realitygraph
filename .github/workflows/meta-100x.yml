name: meta-100x-adaptive-budget

on:
  push:
    branches: [meta-100x-v1]
  workflow_dispatch:

concurrency:
  group: meta-100x-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sealed-adaptive-budget:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Policy unit tests
        run: |
          python -m unittest tests.test_meta_policy tests.test_adaptive_policy -v

      - name: Rebuild one hundred classification training worlds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gathered-meta-train
          seq 0 99 | xargs -P 8 -I{} bash -c '
            export REALITYGRAPH_PMLB_INDEX="{}"
            export REALITYGRAPH_PMLB_RESULT="gathered-meta-train/pmlb-world-{}.json"
            python pmlb_meta_world.py
          '

      - name: Freeze exact rank policy and compile adaptive budget
        env:
          REALITYGRAPH_META_TRAIN_DIR: gathered-meta-train
          REALITYGRAPH_META_POLICY_DIR: meta-policy-out
        run: |
          set -euo pipefail
          test ! -e gathered-meta-regression-next
          python learn_pmlb_meta_policy.py
          actual="$(shasum -a 256 meta-policy-out/meta_policy.mg | awk '{print $1}')"
          expected="f80932ec2ce05e85899787a9bd13da15ea7007a496526cb69c776c3bc56baf47"
          echo "base_policy_sha256=$actual"
          test "$actual" = "$expected"
          python learn_adaptive_budget.py
          echo "NEXT_REGRESSION_BLOCK_NOT_YET_CONSTRUCTED"

      - name: Build next twenty untouched regression worlds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gathered-meta-regression-next
          seq 20 39 | xargs -P 4 -I{} bash -c '
            export REALITYGRAPH_PMLB_REGRESSION_INDEX="{}"
            export REALITYGRAPH_PMLB_REGRESSION_RESULT="gathered-meta-regression-next/pmlb-regression-world-{}.json"
            python pmlb_regression_world.py
          '

      - name: Restart adaptive memory in next unseen worlds
        env:
          REALITYGRAPH_REGRESSION_HELDOUT_DIR: gathered-meta-regression-next
          REALITYGRAPH_META_POLICY_DIR: meta-policy-out
        run: python evaluate_adaptive_budget.py

      - name: Preserve adaptive-budget evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-100x-adaptive-budget-evidence
          path: |
            meta-policy-out
            meta-adaptive-summary.json
            gathered-meta-regression-next
          if-no-files-found: warn
          retention-days: 7

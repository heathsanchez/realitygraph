name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: realitygraph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  realitygraph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verified learning demo
        run: python demo.py
      - name: Compounding field demo
        run: python field_demo.py

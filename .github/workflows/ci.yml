name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  realitygraph:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      REALITYGRAPH_RUN_SEED: ${{ github.sha }}-${{ github.run_id }}
      REALITYGRAPH_FREEZE_SEED: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verified learning demo
        run: python demo.py
      - name: Compounding field demo
        run: python field_demo.py
      - name: Blind meta-world transfer
        run: python meta_world_demo.py
      - name: Real-world mechanism stress suite
        run: python real_world_demo.py
      - name: Real measured dataset audit
        run: python real_data_demo.py
      - name: Sealed future measurement benchmark
        run: python future_data_demo.py
      - name: Adaptive consequence frontier
        run: python consequence_future_demo.py
      - name: Predictive consequence field
        run: python predictive_field_demo.py

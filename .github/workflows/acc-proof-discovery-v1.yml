name: ACC proof discovery v1

on:
  push:
    branches: [acc-proof-discovery-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RealityGraph branch
        uses: actions/checkout@v4

      - name: Checkout pinned official ACC repository
        uses: actions/checkout@v4
        with:
          repository: SAIRcompetition/Andrews-Curtis
          ref: a0fd6e6f52d82c93ccc06ab91d81e8fa3678256e
          path: official

      - name: Verify official pin and move-spec hash
        run: |
          test "$(git -C official rev-parse HEAD)" = "a0fd6e6f52d82c93ccc06ab91d81e8fa3678256e"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = "sha256:e13f57d82b5db1a79c1bd9d5ee1f6665ac4d96a634a3656ea20c0ada82e07643"
          spec = json.loads(Path("official/competition/tools/verifier/data/move_spec.json").read_text())
          canon = json.dumps(spec["moves"], sort_keys=True, separators=(",", ":"), ensure_ascii=True)
          got = "sha256:" + hashlib.sha256(canon.encode()).hexdigest()
          assert got == expected, (got, expected)
          print("move_spec_hash", got)
          PY

      - name: Run unit tests
        run: |
          python -m pip install -q pytest
          python -m pytest \
            tests/test_acc.py \
            tests/test_acc_training_replay.py \
            tests/test_acc_capability.py \
            tests/test_acc_transfer.py \
            tests/test_acc_source_entry.py -q

      - name: Replay all 424 certified AC trajectories
        run: |
          python acc_training_replay.py \
            --training official/competition/examples/training_424.json \
            --trajectories acc-training-trajectories.jsonl \
            --summary acc-training-replay-summary.json
          cat acc-training-replay-summary.json
          python - <<'PY'
          import json
          s = json.load(open("acc-training-replay-summary.json"))
          assert s["instances"] == 424, s
          assert s["accepted"] == 424, s
          assert s["rejected"] == 0, s
          PY

      - name: Cross-check all 424 with official verifier
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("official/competition/tools").resolve()))
          from verifier.core import verify

          training = json.loads(Path("official/competition/examples/training_424.json").read_text())
          manifest = json.loads(Path("official/competition/examples/training_manifest.json").read_text())
          challenges = {
              c["challenge_id"]: c
              for c in manifest["challenges"]
              if c["move_spec_version"] == "ac-r2-v1"
          }
          accepted = 0
          for instance in training["instances"]:
              result = verify(
                  challenges[instance["training_id"]],
                  instance["moves"],
                  "ac-r2-v1",
                  manifest["limits"],
              )
              if not result["ok"]:
                  raise SystemExit(f"official verifier rejected {instance['training_id']}: {result}")
              accepted += 1
          assert accepted == 424
          print(f"official_verifier_accepted={accepted}/424")
          PY

      - name: Diagnose scored-pool MS representative mapping
        run: python acc_mapping_diagnostic.py

      - name: Run frozen held-out audit and bridged open MS transfer
        run: |
          python acc_open_ms_transfer.py \
            --trajectories acc-training-trajectories.jsonl \
            --metadata official/competition/tools/verifier/data/ms1190_metadata.csv \
            --manifest official/competition/tools/verifier/data/manifest.json \
            --official-tools official/competition/tools \
            --summary acc-proof-discovery-summary.json \
            --bank acc-capability-bank.json \
            --submission acc-open-ms-candidates.txt \
            --audit-budget 100 \
            --open-budget 3000
          python - <<'PY'
          import json
          s = json.load(open("acc-proof-discovery-summary.json"))
          a = s["audit"]
          o = s["open_transfer"]
          assert a["exact_restart"] is True, a
          assert a["ablation_mismatches"] == 0, a
          assert a["exact_macro_reuse_events"] > 0, a
          assert a["warm_only_solved"] > 0, a
          assert a["warm_expansions_on_both"] < a["cold_expansions_on_both"], a
          assert o["open_metadata_rows"] == 550, o
          assert o["orbit_manifest_matches"] == 550, o
          assert o["bridged_manifest_matches"] == 550, o
          assert o["unmatched_open_rows"] == 0, o
          assert o["officially_verified_open_solved"] == o["open_solved"], o
          print("heldout_warm_only", a["warm_only_solved"])
          print("open_verified", o["officially_verified_open_solved"])
          PY

      - name: Diagnose open-MS search residual
        run: |
          python acc_search_diagnostics.py \
            --trajectories acc-training-trajectories.jsonl \
            --metadata official/competition/tools/verifier/data/ms1190_metadata.csv \
            --output acc-open-ms-diagnostic.json \
            --budget 1000

      - name: Run prospective source-conditioned transfer
        run: |
          python acc_source_transfer.py \
            --trajectories acc-training-trajectories.jsonl \
            --metadata official/competition/tools/verifier/data/ms1190_metadata.csv \
            --manifest official/competition/tools/verifier/data/manifest.json \
            --official-tools official/competition/tools \
            --summary acc-source-transfer-summary.json \
            --submission acc-source-open-candidates.txt \
            --audit-budget 50 \
            --open-budget 3000
          python - <<'PY'
          import json
          s = json.load(open("acc-source-transfer-summary.json"))
          a = s["source_audit"]
          o = s["open_transfer"]
          assert a["ablation_mismatches"] == 0, a
          assert a["source_macro_presentations"] == a["heldout_presentations"], a
          assert o["officially_verified_open_solved"] == o["open_solved"], o
          print("source_audit", json.dumps(a, sort_keys=True))
          print("source_open", json.dumps(o, sort_keys=True))
          PY

      - name: Upload ACC evidence
        uses: actions/upload-artifact@v4
        with:
          name: acc-proof-discovery-v1
          path: |
            acc-training-replay-summary.json
            acc-training-trajectories.jsonl
            acc-proof-discovery-summary.json
            acc-capability-bank.json
            acc-open-ms-candidates.txt
            acc-open-ms-diagnostic.json
            acc-source-transfer-summary.json
            acc-source-open-candidates.txt

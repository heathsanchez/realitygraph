name: QCKN global event bus v1

on:
  push:
    branches: [qckn-global-event-bus-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Flash bus tests
        run: python -m unittest tests.test_flash_bus -v
      - name: Ingest real verified project events
        run: python qckn_global_real_event_ingest_v1.py

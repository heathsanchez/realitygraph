name: QCKN end-to-end v1

on:
  push:
    branches: [qckn-end-to-end-v1]
    paths:
      - 'verified_meta_growth_v3.py'
      - 'realitygraph/ledger.py'
      - 'realitygraph/compiled_present.py'
      - 'realitygraph/memory_graph.py'
      - 'tests/test_qckn_end_to_end.py'
      - 'tests/test_causal_compiled_present.py'
      - '.github/workflows/qckn-end-to-end-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  end-to-end:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qualify causal compiled present
        run: |
          python -m unittest             tests.test_causal_compiled_present             tests.test_qckn_end_to_end -v
      - name: Re-run bounded verified meta-growth from causal ledger
        run: python verified_meta_growth_v3.py

name: parkinson-geometry-core-contraction-v2
on:
  push:
    branches:
      - parkinson-geometry-core-contraction-v2
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy
      - run: python -m unittest tests.test_geometry_core_contraction -v
      - run: |
          if [ -f parkinson_geometry_core_contraction_v2.py ]; then
            python -m py_compile parkinson_geometry_core_contraction_v2.py
          fi

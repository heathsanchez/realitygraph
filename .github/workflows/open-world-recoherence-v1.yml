name: Open World Recoherence V1

on:
  push:
    branches:
      - qckn-open-world-recoherence-v1
    paths:
      - 'open_world_recoherence_v1.py'
      - 'docs/research/open-world-recoherence-v1.md'
      - '.github/workflows/open-world-recoherence-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run bounded prospective open-world recoherence precursor
        run: |
          mkdir -p artifacts/open-world-recoherence-v1
          python open_world_recoherence_v1.py | tee artifacts/open-world-recoherence-v1/result.json

      - name: Enforce scientific gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('artifacts/open-world-recoherence-v1/result.json').read_text())
          assert p['verdict'] == 'PASS_OPEN_WORLD_RECOHERENCE_V1', p['verdict']
          assert p['classification'] == 'BOUNDED_PROSPECTIVE_OPEN_WORLD_PRECURSOR'
          assert all(p['gates'].values()), p['gates']
          assert p['warm']['total_checks'] < p['cold']['total_checks']
          assert p['macro_ablation']['total_checks'] > p['warm']['total_checks']
          print('OPEN_WORLD_RECOHERENCE_V1=PASS')
          print('WARM_CHECKS', p['warm']['total_checks'])
          print('COLD_CHECKS', p['cold']['total_checks'])
          print('ABLATION_CHECKS', p['macro_ablation']['total_checks'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: open-world-recoherence-v1-evidence
          path: artifacts/open-world-recoherence-v1/result.json
          if-no-files-found: error

name: equational-countermodel-constructor-scan

on:
  push:
    branches: [equational-residual-v1]
    paths:
      - equational_countermodel_constructor_scan.py
      - equational_residual_demo.py
      - equational_transition_demo.py
      - .github/workflows/equational-countermodel-constructor-scan.yml
  workflow_dispatch:

concurrency:
  group: equational-countermodel-constructor-scan-v1
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify historical countermodel constructors
        run: python equational_countermodel_constructor_scan.py
      - uses: actions/upload-artifact@v4
        with:
          name: equational-countermodel-constructor-scan-v1
          path: results/equational-countermodel-constructor-scan-v1.json
          if-no-files-found: error
          retention-days: 3

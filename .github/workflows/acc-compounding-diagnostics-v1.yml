name: ACC compounding diagnostics v1

on:
  push:
    branches: [acc-developmental-system-v4-diagnostics]
  workflow_dispatch:

concurrency:
  group: acc-compounding-diagnostics-v1
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout RealityGraph branch
        uses: actions/checkout@v4

      - name: Checkout pinned official ACC repository
        uses: actions/checkout@v4
        with:
          repository: SAIRcompetition/Andrews-Curtis
          ref: a0fd6e6f52d82c93ccc06ab91d81e8fa3678256e
          path: official

      - name: Run ACC tests
        run: |
          python -m pip install -q pytest
          python -m pytest tests/test_acc*.py -q

      - name: Rebuild exact 424 trajectory corpus
        run: |
          python acc_training_replay.py \
            --training official/competition/examples/training_424.json \
            --trajectories acc-training-trajectories.jsonl \
            --summary acc-training-replay-summary.json

      - name: Extract distinguishing verified trajectories
        run: |
          python acc_compounding_diagnostics.py \
            --trajectories acc-training-trajectories.jsonl \
            --training-manifest official/competition/examples/training_manifest.json \
            --official-tools official/competition/tools \
            --summary acc-compounding-diagnostics.json \
            --budget 100
          python - <<'PY'
          import json
          s=json.load(open('acc-compounding-diagnostics.json'))
          print('rows', len(s['rows']))
          print('verified_by_variant', s['verified_by_variant'])
          print('v3_only', s['v3_only'])
          print('common_ngrams', s['common_ngrams'][:10])
          PY

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: acc-compounding-diagnostics-v1
          path: acc-compounding-diagnostics.json
          retention-days: 14

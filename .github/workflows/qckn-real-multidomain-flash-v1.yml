name: QCKN Real Multidomain Flash V1

on:
  push:
    branches:
      - qckn-real-multidomain-flash-v1
    paths:
      - "realitygraph/real_flash.py"
      - "qckn_real_multidomain_flash_v1.py"
      - "tests/test_real_flash.py"
      - "docs/research/qckn-real-multidomain-flash-v1.md"
      - ".github/workflows/qckn-real-multidomain-flash-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-multidomain-flash:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit-test authority-gated graph
        run: |
          python -m unittest tests.test_real_flash -v

      - name: Attach pinned real evidence and run Flash closure
        run: |
          mkdir -p /tmp/qckn-real-multidomain-flash-v1
          python qckn_real_multidomain_flash_v1.py \
            --out /tmp/qckn-real-multidomain-flash-v1 \
            | tee /tmp/qckn-real-multidomain-flash-v1/run.log

      - name: Gate real-evidence result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/qckn-real-multidomain-flash-v1")
          r=json.loads((root/"real-multidomain-flash-v1.json").read_text())
          assert r["verdict"]=="PASS"
          assert all(r["gates"].values())
          x=r["cross_domain_result"]
          assert set(x["genuine_meta_flash"]["supporting_domains"])=={"sair","arc","gpu-ir"}
          assert x["scoped_content"]["type_mismatches"]==4
          assert x["scoped_content"]["cached_repeat_blocks"]==4
          assert set(x["still_unresolved"])=={
              "res:lean-kernel:restartable-negative-reuse",
              "res:gpu-hardware:promote-ir-capability",
          }
          print("PASS_QCKN_REAL_MULTIDOMAIN_FLASH_V1")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qckn-real-multidomain-flash-v1
          path: /tmp/qckn-real-multidomain-flash-v1/
          if-no-files-found: error

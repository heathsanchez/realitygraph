name: QCKN Flash non-dual v1

on:
  push:
    branches:
      - qckn-flash-nondual-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  future-quotient-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run future quotient and nonlinear flash tests
        run: python -m unittest tests.test_flash_future_quotient tests.test_flash_nonlinear -v
      - name: Run frozen nonlinear non-dual experiment
        run: python qckn_flash_nonlinear_nondual_v1.py

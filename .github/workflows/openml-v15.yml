name: openml-v15-retained-verifier
on:
  push:
    branches:
      - openml-v15
  workflow_dispatch:
concurrency:
  group: openml-v15-retained-verifier
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REALITYGRAPH_OPENML_V15_RESULT: openml-v15-summary.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet openml pandas
      - name: Run retained verifier policy V15
        run: python openml_v15.py
      - name: Preserve V15 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openml-v15-evidence
          path: openml-v15-summary.json
          if-no-files-found: warn
          retention-days: 14

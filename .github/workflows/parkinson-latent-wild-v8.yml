name: parkinson-latent-wild-v8
on:
  push:
    branches:
      - parkinson-latent-wild-v8
  workflow_dispatch:
concurrency:
  group: parkinson-latent-wild-v8-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy scipy scikit-learn joblib
      - run: python -m unittest tests.test_latent_wild -v
      - run: |
          for f in parkinson_latent_wild_v8.py parkinson_runtime_latent_patch.py parkinson_build_latent_v8.py; do
            if [ -f "$f" ]; then python -m py_compile "$f"; fi
          done

name: verify-derived-specializations

on:
  push:
    branches: [equational-residual-v1]
    paths:
      - certificates/4922_to_4158.lean
      - certificates/4922_to_4258.lean
      - .github/workflows/verify-derived-specializations.yml
  workflow_dispatch:

concurrency:
  group: verify-derived-specializations-v1
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Lean 4.33.1
        run: elan toolchain install leanprover/lean4:v4.33.1
      - name: Kernel-check 4922 to 4158
        run: lean +leanprover/lean4:v4.33.1 -j 1 -M 4096 certificates/4922_to_4158.lean
      - name: Kernel-check 4922 to 4258
        run: lean +leanprover/lean4:v4.33.1 -j 1 -M 4096 certificates/4922_to_4258.lean

name: scope-compounding-v6

on:
  push:
    branches:
      - v6-scope
  workflow_dispatch:

concurrency:
  group: scope-compounding-v6
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REALITYGRAPH_SCOPE_V6_RESULT: scope-compounding-v6-summary.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exhaustive final PMLB scope compounding
        run: python scope_compounding_v6.py
      - name: Preserve V6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scope-compounding-v6-evidence
          path: scope-compounding-v6-summary.json
          if-no-files-found: warn
          retention-days: 14

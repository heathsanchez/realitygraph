name: equational-residual

on:
  push:
    branches: [equational-residual-v1]
    paths:
      - equational_residual_demo.py
      - realitygraph/predictive.py
      - .github/workflows/equational-residual.yml
  workflow_dispatch:

concurrency:
  group: equational-residual-v1
  cancel-in-progress: true

jobs:
  residual-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify predictive core
        run: python -m unittest tests.test_predictive_field -v
      - name: Run sealed external residual transfer
        env:
          REALITYGRAPH_EQUATIONAL_RESULT: results/equational-residual-v1.json
        run: python equational_residual_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: equational-residual-v1
          path: results/equational-residual-v1.json
          if-no-files-found: error
          retention-days: 3

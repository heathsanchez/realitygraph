name: parkinson-safe-trajectory-gate-v4
on:
  push:
    branches:
      - parkinson-safe-trajectory-gate-v4
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy
      - run: python -m unittest tests.test_safe_trajectory_gate -v
      - run: |
          if [ -f parkinson_safe_trajectory_gate_v4.py ]; then
            python -m py_compile parkinson_safe_trajectory_gate_v4.py
          fi
